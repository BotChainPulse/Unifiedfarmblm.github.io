<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Unified Farm BLM</title>
    <meta name="description" content="Sorry, the page you are looking for does not exist. Visit our homepage for fresh poultry products and farming guides.">
    <meta name="robots" content="noindex, follow">
    <script>
        (function () {
            var host = window.location.hostname.toLowerCase();
            var path = window.location.pathname.toLowerCase();
            var query = window.location.search || '';
            var hash = window.location.hash || '';
            var canonicalHost = 'www.unifiedfarmblm.com';
            var isQrUrl = path.indexOf('qr') !== -1 || path.indexOf('qrcode') !== -1 || path.indexOf('qr-code') !== -1;
            var legacyToolTerms = ['tool', 'calculator', 'livestock', 'feed', 'generator'];
            var isLegacyToolUrl = legacyToolTerms.some(function (term) { return path.indexOf(term) !== -1; });

            if (isQrUrl) {
                window.location.replace('https://' + canonicalHost + '/tools/qr-code-generator.html');
                return;
            }

            if (isLegacyToolUrl) {
                window.location.replace('https://' + canonicalHost + '/tools/');
                return;
            }

            if (host === 'unifiedfarmblm.com') {
                var targetPath = path === '/' ? '/' : window.location.pathname;
                window.location.replace('https://' + canonicalHost + targetPath + query + hash);
            }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.8; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 40px; }
        h1 { font-size: 6rem; color: #2c5f2d; margin-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; color: #666; margin-bottom: 1.5rem; }
        p { margin-bottom: 2rem; color: #666; }
        .btn { display: inline-block; padding: 12px 30px; background: #2c5f2d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin: 0.5rem; }
        .btn-secondary { background: #f4a261; color: #333; }
        footer { position: fixed; bottom: 0; width: 100%; text-align: center; padding: 1rem; color: #999; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! This page seems to have flown the coop.</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="https://www.unifiedfarmblm.com/" class="btn">Go Home</a>
        <a href="https://www.unifiedfarmblm.com/tools/" class="btn btn-secondary">Free Tools</a>
        <a href="https://www.unifiedfarmblm.com/blog/" class="btn btn-secondary">Read Our Blog</a>
    </div>
    <footer>
        <p>© 2026 Unified Farm BLM. All rights reserved. | Mpigi, Uganda</p>
    </footer>
</body>
</html>
