<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DukaBooks — Invoice, Stock & Credit Book</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--bg:#0b0f14;--card:#131a22;--card2:#1a2330;--line:#22303f;--acc:#10b981;--acc2:#0ea5e9;--txt:#e8eef4;--dim:#7d8fa3;--red:#f87171;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;font-weight:800}.h-acc{color:var(--acc)}
#view{flex:1;overflow-y:auto;padding:6px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 2px 12px;font-size:10px;font-weight:700;cursor:pointer}
nav button.on{color:var(--acc)}
nav button span{display:block;font-size:19px;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dim{color:var(--dim);font-size:12px}.big{font-size:24px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.98)}
.b-acc{background:var(--acc);color:#04220f}.b-sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.b-red{background:#3a1518;color:var(--red)}.b-blue{background:var(--acc2);color:#03202e}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:15px;margin:5px 0;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{font-size:12px;color:var(--dim);font-weight:700}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.p-green{background:#064e3b;color:#34d399}.p-red{background:#4c1d1d;color:#fca5a5}.p-gold{background:#46350a;color:#fcd34d}
.list-it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.qty-ctl{display:flex;align-items:center;gap:10px}
.qty-ctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:17px;font-weight:800;cursor:pointer}
.fab{position:fixed;bottom:76px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#04220f;font-size:26px;font-weight:800;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(16,185,129,.4);z-index:15}
.modal{position:fixed;inset:0;background:rgba(3,6,10,.92);display:none;z-index:30;overflow-y:auto}
.modal.show{display:block}
.modal .sheet{max-width:560px;margin:0 auto;min-height:100%;background:var(--bg);padding:14px 16px 40px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
.sheet-h b{font-size:17px}.x{background:var(--card2);border:none;color:var(--txt);width:36px;height:36px;border-radius:12px;font-size:16px;cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.stat .v{font-size:19px;font-weight:800;margin-top:4px}
.menu-it{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:8px 0;cursor:pointer;font-weight:700;font-size:15px}
.menu-it span{font-size:22px}
.inv-paper{background:#fff;color:#111;border-radius:12px;padding:18px;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Duka<span class="h-acc">Books</span></h1>
    <div class="dim" id="bizName" style="font-weight:700">My Business</div>
  </header>
  <div id="view"></div>
  <nav id="nav"></nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ================= STATE ================= */
const DB={
  get(k,d){try{return JSON.parse(localStorage.getItem('db_'+k))??d}catch(e){return d}},
  set(k,v){localStorage.setItem('db_'+k,JSON.stringify(v))}
};
let settings=DB.get('settings',{biz:'My Business',currency:'UGX',taxPct:0,nextInv:1,passcode:''});
let items=DB.get('items',[]);
let parties=DB.get('parties',[]);
let invoices=DB.get('invoices',[]);
let payments=DB.get('payments',[]);
let expenses=DB.get('expenses',[]);
function saveAll(){DB.set('settings',settings);DB.set('items',items);DB.set('parties',parties);DB.set('invoices',invoices);DB.set('payments',payments);DB.set('expenses',expenses);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function fmt(n){n=Math.round(+n||0);return settings.currency+' '+n.toLocaleString('en-US');}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show');}
function closeSheet(){document.getElementById('modal').classList.remove('show');}
function sheetHead(t){return `<div class="sheet-h"><b>${t}</b><button class="x" onclick="closeSheet()">✕</button></div>`;}

/* derived */
function partyBalance(pid){ // positive = they owe me
  let b=0;
  invoices.forEach(v=>{if(v.partyId===pid){b+= v.type==='sale'? (v.total-v.paid) : -(v.total-v.paid);}});
  payments.forEach(p=>{if(p.partyId===pid){b+= p.dir==='in'? -p.amount : p.amount;}});
  return b;
}
function stockValue(){return items.reduce((s,i)=>s+(i.stock||0)*(i.cost||0),0);}
function daySales(d){return invoices.filter(v=>v.type==='sale'&&v.date===d).reduce((s,v)=>s+v.total,0);}
function receivables(){let r={};invoices.forEach(v=>{if(v.type==='sale')r[v.partyId]=(r[v.partyId]||0)+v.total-v.paid;});
  payments.forEach(p=>{if(p.dir==='in')r[p.partyId]=(r[p.partyId]||0)-p.amount;});
  return Object.entries(r).filter(([,b])=>b>0);}

/* ================= NAV ================= */
const TABS=[['home','🏠','Home'],['sales','🧾','Sales'],['stock','📦','Stock'],['parties','👥','Parties'],['more','⋯','More']];
let curTab='home';
function go(t){curTab=t;renderNav();VIEWS[t]();window.scrollTo(0,0);document.getElementById('view').scrollTop=0;}
function renderNav(){document.getElementById('nav').innerHTML=TABS.map(([id,ic,lb])=>`<button class="${id===curTab?'on':''}" onclick="go('${id}')"><span>${ic}</span>${lb}</button>`).join('');}
function v(){return document.getElementById('view');}
</script>
<script>
/* ================= HOME ================= */
function viewHome(){
  const recv=receivables().reduce((s,[,b])=>s+b,0);
  const todayExp=expenses.filter(e=>e.date===today()).reduce((s,e)=>s+e.amount,0);
  const low=items.filter(i=>(i.stock||0)<=(i.lowAt??3));
  v().innerHTML=`
  <div class="dim" style="margin:4px 0 2px">📅 ${new Date().toDateString()}</div>
  <div class="card" style="background:linear-gradient(135deg,#0d3b2e,#131a22)">
    <div class="dim">TODAY'S SALES</div>
    <div class="big" style="color:var(--acc)">${fmt(daySales(today()))}</div>
    <div class="dim" style="margin-top:4px">Expenses today: ${fmt(todayExp)}</div>
  </div>
  <div class="grid2">
    <div class="stat"><div class="dim">💰 OWED TO YOU</div><div class="v" style="color:var(--gold)">${fmt(recv)}</div></div>
    <div class="stat"><div class="dim">📦 STOCK VALUE</div><div class="v">${fmt(stockValue())}</div></div>
    <div class="stat" onclick="go('sales')" style="cursor:pointer"><div class="dim">🧾 INVOICES</div><div class="v">${invoices.filter(i=>i.type==='sale').length}</div></div>
    <div class="stat" onclick="go('parties')" style="cursor:pointer"><div class="dim">👥 PARTIES</div><div class="v">${parties.length}</div></div>
  </div>
  ${low.length?`<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">⚠️ Low stock (${low.length})</b>${low.map(i=>`<div class="row" style="margin-top:8px"><span>${esc(i.name)}</span><span class="pill p-red">${i.stock} left</span></div>`).join('')}</div>`:''}
  <button class="btn b-acc" onclick="newInvoice()">＋ New Sale</button>
  <button class="btn b-sec" onclick="go('parties');setTimeout(()=>newParty(),80)">＋ Add Customer</button>`;
}

/* ================= SALES ================= */
function viewSales(){
  const list=invoices.filter(i=>i.type==='sale').sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no);
  v().innerHTML=`
  <div class="row" style="margin:8px 0"><b style="font-size:17px">Sales Invoices</b>
  <input id="sSearch" placeholder="🔍 Search..." style="width:52%;margin:0" oninput="viewSales()"></div>
  <div id="invList"></div>`;
  const q=(document.getElementById('sSearch')?.value||'').toLowerCase();
  document.getElementById('invList').innerHTML=list.length?list.filter(vv=>!q||vv.partyName.toLowerCase().includes(q)||String(vv.no).includes(q)).map(vv=>`
    <div class="list-it" onclick="openInvoice('${vv.id}')">
      <div class="row"><b>#${vv.no} · ${esc(vv.partyName)}</b><b>${fmt(vv.total)}</b></div>
      <div class="row" style="margin-top:4px"><span class="dim">${vv.date} · ${vv.items.length} item(s)</span>
      ${vv.paid>=vv.total?'<span class="pill p-green">PAID</span>':`<span class="pill p-red">DUE ${fmt(vv.total-vv.paid)}</span>`}</div>
    </div>`).join(''):'<div class="card dim" style="text-align:center">No sales yet.<br>Tap ＋ to make your first sale!</div>';
  const fab=document.createElement('button');fab.className='fab';fab.textContent='＋';fab.onclick=()=>newInvoice();
  document.getElementById('app').appendChild(fab);setTimeout(()=>{const f=[...document.querySelectorAll('.fab')];f.slice(0,-1).forEach(x=>x.remove());},0);
}

let draft=null;
function newInvoice(){
  draft={partyId:'walkin',lines:[],paid:0,tax:settings.taxPct>0};
  renderDraft();
}
function renderDraft(){
  const custs=parties.filter(p=>p.type!=='supp');
  const subtotal=draft.lines.reduce((s,l)=>s+l.qty*l.price,0);
  const taxAmt=draft.tax?Math.round(subtotal*settings.taxPct/100):0;
  const total=subtotal+taxAmt;
  openSheet(sheetHead('🧾 New Sale')+`
    <label>Customer</label>
    <select id="dParty" onchange="draft.partyId=this.value">
      <option value="walkin">🚶 Walk-in customer</option>
      ${custs.map(p=>`<option value="${p.id}" ${draft.partyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select>
    <div class="row" style="margin:8px 0 2px"><b>Items</b><button class="x" style="width:auto;padding:0 14px;background:var(--acc);color:#04220f;font-weight:800" onclick="pickItem()">＋ Add item</button></div>
    ${draft.lines.map((l,i)=>`
      <div class="card" style="padding:10px">
        <div class="row"><b>${esc(l.name)}</b><b>${fmt(l.qty*l.price)}</b></div>
        <div class="row" style="margin-top:6px">
          <div class="qty-ctl">
            <button onclick="dQty(${i},-1)">−</button><b>${l.qty}</b><button onclick="dQty(${i},1)">＋</button>
          </div>
          <span class="dim">@ ${fmt(l.price)}</span>
          <button class="x" style="width:30px;height:30px" onclick="draft.lines.splice(${i},1);renderDraft()">🗑</button>
        </div>
      </div>`).join('')||'<div class="dim card" style="text-align:center">No items — tap ＋ Add item</div>'}
    <div class="card">
      <div class="row"><span class="dim">Subtotal</span><b>${fmt(subtotal)}</b></div>
      ${settings.taxPct>0?`<div class="row" style="margin-top:6px"><span class="dim"><input type="checkbox" ${draft.tax?'checked':''} style="width:auto" onclick="draft.tax=this.checked;renderDraft()"> VAT ${settings.taxPct}%</span><b>${fmt(taxAmt)}</b></div>`:''}
      <div class="row" style="margin-top:8px;font-size:17px"><b>TOTAL</b><b style="color:var(--acc)">${fmt(total)}</b></div>
    </div>
    <label>Amount paid now (${settings.currency})</label>
    <input type="number" id="dPaid" value="${draft.paid||''}" placeholder="Full = ${total}" oninput="draft.paid=+this.value||0">
    <button class="btn b-acc" onclick="saveInvoice(${total})">✅ Complete Sale — ${fmt(total)}</button>`);
}
function dQty(i,d){draft.lines[i].qty=Math.max(1,draft.lines[i].qty+d);renderDraft();}
function pickItem(){
  if(!items.length){toast('Add items in Stock tab first');return;}
  openSheet(sheetHead('Add Item')+items.map((it,ix)=>`
    <div class="list-it" onclick="addLine(${ix})">
      <div class="row"><b>${esc(it.name)}</b><span class="pill ${it.stock<=0?'p-red':'p-green'}">${it.stock} ${esc(it.unit||'pc')}</span></div>
      <div class="dim" style="margin-top:3px">${fmt(it.price)} per ${esc(it.unit||'pc')}</div>
    </div>`).join('')+`<button class="btn b-sec" onclick="renderDraft()">← Back</button>`);
}
function addLine(ix){
  const it=items[ix];
  const ex=draft.lines.find(l=>l.itemId===it.id);
  if(ex)ex.qty++;else draft.lines.push({itemId:it.id,name:it.name,price:it.price,cost:it.cost||0,qty:1});
  renderDraft();
}
function saveInvoice(total){
  if(!draft.lines.length){toast('Add at least one item');return;}
  const paid=Math.min(draft.paid||total,total);
  if(draft.partyId==='walkin'&&paid<total){toast('Walk-in must pay in full — add a customer for credit');return;}
  const party=parties.find(p=>p.id===draft.partyId);
  draft.lines.forEach(l=>{const it=items.find(i=>i.id===l.itemId);if(it)it.stock=(it.stock||0)-l.qty;});
  const inv={id:uid(),no:settings.nextInv++,date:today(),partyId:draft.partyId,partyName:party?party.name:'Walk-in',items:draft.lines,taxPct:draft.tax?settings.taxPct:0,total,paid,type:'sale'};
  invoices.push(inv);
  if(paid>0)payments.push({id:uid(),date:today(),partyId:inv.partyId,amount:paid,dir:'in',note:'Invoice #'+inv.no});
  saveAll();closeSheet();toast('✅ Sale #'+inv.no+' saved!');
  openInvoice(inv.id);
}
function openInvoice(id){
  const vv=invoices.find(i=>i.id===id);if(!vv)return;
  const party=parties.find(p=>p.id===vv.partyId);
  const sub=vv.items.reduce((s,l)=>s+l.qty*l.price,0);
  openSheet(sheetHead('Invoice #'+vv.no)+`
    <div class="inv-paper">
      <div style="text-align:center"><b style="font-size:16px">${esc(settings.biz)}</b><br><span style="color:#666">${vv.date}</span></div>
      <hr style="margin:10px 0;border:none;border-top:1px dashed #999">
      <b>Bill to:</b> ${esc(vv.partyName)}${party&&party.phone?' · '+esc(party.phone):''}<br>
      <hr style="margin:10px 0;border:none;border-top:1px dashed #999">
      ${vv.items.map(l=>`<div style="display:flex;justify-content:space-between"><span>${esc(l.name)} × ${l.qty}</span><b>${(l.qty*l.price).toLocaleString()}</b></div>`).join('')}
      <hr style="margin:10px 0;border:none;border-top:1px dashed #999">
      <div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>${sub.toLocaleString()}</b></div>
      ${vv.taxPct?`<div style="display:flex;justify-content:space-between"><span>VAT ${vv.taxPct}%</span><b>${(vv.total-sub).toLocaleString()}</b></div>`:''}
      <div style="display:flex;justify-content:space-between;font-size:16px;margin-top:4px"><b>TOTAL ${settings.currency}</b><b>${vv.total.toLocaleString()}</b></div>
      <div style="display:flex;justify-content:space-between;color:${vv.paid>=vv.total?'#0a7a4a':'#c0392b'}"><span>Paid</span><b>${vv.paid.toLocaleString()}</b></div>
      ${vv.paid<vv.total?`<div style="display:flex;justify-content:space-between;color:#c0392b"><span>Balance due</span><b>${(vv.total-vv.paid).toLocaleString()}</b></div>`:''}
      <div style="text-align:center;color:#888;margin-top:12px">Thank you for your business! 🙏<br>Powered by DukaBooks</div>
    </div>
    <button class="btn b-acc" onclick="shareInvoice('${vv.id}')">📲 Share on WhatsApp</button>
    ${vv.paid<vv.total?`<button class="btn b-blue" onclick="payInvoice('${vv.id}')">💰 Record Payment</button>`:''}
    <button class="btn b-sec" onclick="closeSheet()">Done</button>`);
}
function shareInvoice(id){
  const vv=invoices.find(i=>i.id===id);
  const sub=vv.items.reduce((s,l)=>s+l.qty*l.price,0);
  let txt=`*${settings.biz}*\nInvoice #${vv.no} — ${vv.date}\nCustomer: ${vv.partyName}\n────────────\n`;
  vv.items.forEach(l=>{txt+=`${l.name} × ${l.qty}  =  ${(l.qty*l.price).toLocaleString()}\n`;});
  txt+=`────────────\n${vv.taxPct?`VAT ${vv.taxPct}%: ${(vv.total-sub).toLocaleString()}\n`:''}*TOTAL: ${settings.currency} ${vv.total.toLocaleString()}*\nPaid: ${vv.paid.toLocaleString()}${vv.paid<vv.total?`\n*Balance due: ${(vv.total-vv.paid).toLocaleString()}*`:''}\n\nThank you! 🙏`;
  const url='https://wa.me/?text='+encodeURIComponent(txt);
  if(window.AndroidShare){AndroidShare.share(txt);}
  else window.open(url,'_blank');
}
function payInvoice(id){
  const vv=invoices.find(i=>i.id===id);const due=vv.total-vv.paid;
  openSheet(sheetHead('💰 Record Payment')+`
    <div class="card"><div class="row"><span>Invoice #${vv.no} balance</span><b style="color:var(--red)">${fmt(due)}</b></div></div>
    <label>Amount received</label><input type="number" id="payAmt" value="${due}">
    <button class="btn b-acc" onclick="doPay('${id}')">✅ Save Payment</button>`);
}
function doPay(id){
  const amt=+document.getElementById('payAmt').value||0;if(amt<=0){toast('Enter amount');return;}
  const vv=invoices.find(i=>i.id===id);
  vv.paid=Math.min(vv.total,vv.paid+amt);
  payments.push({id:uid(),date:today(),partyId:vv.partyId,amount:amt,dir:'in',note:'Invoice #'+vv.no});
  saveAll();toast('💰 Payment saved');openInvoice(id);
}
</script>
<script>
/* ================= STOCK / ITEMS ================= */
function viewStock(){
  v().innerHTML=`<div class="row" style="margin:8px 0"><b style="font-size:17px">📦 Items & Stock</b>
    <span class="pill p-gold">${items.length} items</span></div>`+
    (items.length?items.map(it=>`
    <div class="list-it" onclick="editItem('${it.id}')">
      <div class="row"><b>${esc(it.name)}</b><b>${fmt(it.price)}</b></div>
      <div class="row" style="margin-top:4px"><span class="dim">cost ${fmt(it.cost||0)} · per ${esc(it.unit||'pc')}</span>
      <span class="pill ${it.stock<=(it.lowAt??3)?'p-red':'p-green'}">${it.stock} in stock</span></div>
    </div>`).join(''):'<div class="card dim" style="text-align:center">No items yet. Add what you sell!</div>');
  const fab=document.createElement('button');fab.className='fab';fab.textContent='＋';fab.onclick=()=>editItem();
  document.getElementById('app').appendChild(fab);setTimeout(()=>{const f=[...document.querySelectorAll('.fab')];f.slice(0,-1).forEach(x=>x.remove());},0);
}
function editItem(id){
  const it=items.find(i=>i.id===id)||{name:'',unit:'pc',price:'',cost:'',stock:0,lowAt:3};
  openSheet(sheetHead(id?'✏️ Edit Item':'＋ New Item')+`
    <label>Item name</label><input id="iName" value="${esc(it.name)}" placeholder="e.g. Sugar 1kg">
    <div class="grid2">
      <div><label>Unit</label><input id="iUnit" value="${esc(it.unit||'pc')}" placeholder="pc / kg / bag"></div>
      <div><label>Stock qty</label><input id="iStock" type="number" value="${it.stock}"></div>
      <div><label>Selling price</label><input id="iPrice" type="number" value="${it.price}"></div>
      <div><label>Cost price</label><input id="iCost" type="number" value="${it.cost}"></div>
    </div>
    <label>Low-stock alert at</label><input id="iLow" type="number" value="${it.lowAt??3}">
    <button class="btn b-acc" onclick="saveItem('${id||''}')">💾 Save Item</button>
    ${id?`<button class="btn b-red" onclick="delItem('${id}')">🗑 Delete</button>`:''}`);
}
function saveItem(id){
  const name=document.getElementById('iName').value.trim();if(!name){toast('Name required');return;}
  const o={name,unit:document.getElementById('iUnit').value.trim()||'pc',
    stock:+document.getElementById('iStock').value||0,price:+document.getElementById('iPrice').value||0,
    cost:+document.getElementById('iCost').value||0,lowAt:+document.getElementById('iLow').value||3};
  if(id){Object.assign(items.find(i=>i.id===id),o);}else{o.id=uid();items.push(o);}
  saveAll();closeSheet();toast('💾 Saved');viewStock();
}
function delItem(id){if(!confirm('Delete this item?'))return;items=items.filter(i=>i.id!==id);saveAll();closeSheet();viewStock();}

/* ================= PARTIES ================= */
function viewParties(){
  const q=(viewParties.q||'').toLowerCase();
  v().innerHTML=`<div class="row" style="margin:8px 0"><b style="font-size:17px">👥 Parties</b>
    <input placeholder="🔍 Search..." style="width:52%;margin:0" oninput="viewParties.q=this.value;viewParties()"></div>`+
    (parties.length?parties.filter(p=>!q||p.name.toLowerCase().includes(q)).map(p=>{
      const b=partyBalance(p.id);
      return `<div class="list-it" onclick="openParty('${p.id}')">
        <div class="row"><b>${esc(p.name)}</b>
        ${b>0?`<span class="pill p-red">owes ${fmt(b)}</span>`:b<0?`<span class="pill p-green">advance ${fmt(-b)}</span>`:'<span class="pill p-green">settled</span>'}</div>
        <div class="dim" style="margin-top:3px">${esc(p.phone||'no phone')} · ${p.type==='supp'?'supplier':'customer'}</div>
      </div>`;}).join(''):'<div class="card dim" style="text-align:center">No customers yet.<br>Add your first one!</div>');
  const fab=document.createElement('button');fab.className='fab';fab.textContent='＋';fab.onclick=()=>newParty();
  document.getElementById('app').appendChild(fab);setTimeout(()=>{const f=[...document.querySelectorAll('.fab')];f.slice(0,-1).forEach(x=>x.remove());},0);
}
function newParty(){
  openSheet(sheetHead('＋ New Party')+`
    <label>Name</label><input id="pName" placeholder="Customer or supplier name">
    <label>Phone (WhatsApp)</label><input id="pPhone" type="tel" placeholder="07...">
    <label>Type</label><select id="pType"><option value="cust">Customer</option><option value="supp">Supplier</option></select>
    <button class="btn b-acc" onclick="saveParty()">💾 Save</button>`);
}
function saveParty(){
  const name=document.getElementById('pName').value.trim();if(!name){toast('Name required');return;}
  parties.push({id:uid(),name,phone:document.getElementById('pPhone').value.trim(),type:document.getElementById('pType').value});
  saveAll();closeSheet();toast('👥 Saved');viewParties();
}
function openParty(id){
  const p=parties.find(x=>x.id===id);const b=partyBalance(id);
  const tx=[];
  invoices.filter(i=>i.partyId===id).forEach(i=>tx.push({d:i.date,t:'🧾 Invoice #'+i.no,amt:i.total,cls:''}));
  payments.filter(x=>x.partyId===id).forEach(x=>tx.push({d:x.date,t:(x.dir==='in'?'💰 Paid in':'💸 Paid out')+(x.note?' · '+esc(x.note):''),amt:x.amount,cls:x.dir==='in'?'var(--acc)':'var(--red)'}));
  tx.sort((a,b)=>b.d.localeCompare(a.d));
  openSheet(sheetHead('👥 '+esc(p.name))+`
    <div class="card"><div class="row"><span class="dim">${esc(p.phone||'')}</span>
    ${b>0?`<b style="color:var(--red)">Owes you ${fmt(b)}</b>`:b<0?`<b style="color:var(--acc)">Advance ${fmt(-b)}</b>`:'<b style="color:var(--acc)">All settled ✅</b>'}</div></div>
    ${tx.map(t=>`<div class="row" style="padding:9px 2px;border-bottom:1px solid var(--line)"><span style="font-size:13px">${t.t}<br><span class="dim">${t.d}</span></span><b style="color:${t.cls||'var(--txt)'}">${t.amt.toLocaleString()}</b></div>`).join('')||'<div class="dim card">No transactions yet</div>'}
    <button class="btn b-acc" onclick="closeSheet();newInvoice()">🧾 New Sale</button>
    <button class="btn b-blue" onclick="quickPay('${id}')">💰 Record Payment</button>
    ${b>0&&p.phone?`<button class="btn b-sec" onclick="remindParty('${id}')">📲 Send Reminder (WhatsApp)</button>`:''}`);
}
function quickPay(id){
  openSheet(sheetHead('💰 Payment')+`
    <label>Amount</label><input type="number" id="qAmt" placeholder="0">
    <label>Direction</label><select id="qDir"><option value="in">Received (money in)</option><option value="out">Paid (money out)</option></select>
    <label>Note</label><input id="qNote" placeholder="optional">
    <button class="btn b-acc" onclick="doQuickPay('${id}')">✅ Save</button>`);
}
function doQuickPay(id){
  const amt=+document.getElementById('qAmt').value||0;if(amt<=0){toast('Enter amount');return;}
  payments.push({id:uid(),date:today(),partyId:id,amount:amt,dir:document.getElementById('qDir').value,note:document.getElementById('qNote').value.trim()});
  saveAll();toast('💰 Saved');openParty(id);
}
function remindParty(id){
  const p=parties.find(x=>x.id===id);const b=partyBalance(id);
  const txt=`Hello ${p.name}, this is a friendly reminder from ${settings.biz}: your outstanding balance is *${settings.currency} ${Math.round(b).toLocaleString()}*. Please arrange payment. Thank you! 🙏`;
  if(window.AndroidShare){AndroidShare.share(txt);}else window.open('https://wa.me/'+(p.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(txt),'_blank');
}

/* ================= MORE / MONEY / EXPENSES / REPORTS / SETTINGS ================= */
function viewMore(){
  v().innerHTML=`
  <div class="menu-it" onclick="viewMoney()"><span>💰</span>Cash In / Out (payments)</div>
  <div class="menu-it" onclick="viewExpenses()"><span>💸</span>Expenses</div>
  <div class="menu-it" onclick="viewReports()"><span>📊</span>Reports</div>
  <div class="menu-it" onclick="viewSettings()"><span>⚙️</span>Settings</div>
  <div class="menu-it" onclick="backupData()"><span>☁️</span>Backup data (share file)</div>
  <div class="menu-it" onclick="restoreData()"><span>♻️</span>Restore data</div>
  <div class="card dim" style="text-align:center;margin-top:14px">DukaBooks v1.0 · by Unified Farm BLM<br>All data stays on your device</div>`;
}
function viewMoney(){
  const list=[...payments].sort((a,b)=>b.date.localeCompare(a.date));
  const inn=payments.filter(p=>p.dir==='in').reduce((s,p)=>s+p.amount,0);
  const out=payments.filter(p=>p.dir==='out').reduce((s,p)=>s+p.amount,0);
  v().innerHTML=`<b style="font-size:17px">💰 Money</b>
  <div class="grid2" style="margin-top:8px">
    <div class="stat"><div class="dim">TOTAL IN</div><div class="v" style="color:var(--acc)">${fmt(inn)}</div></div>
    <div class="stat"><div class="dim">TOTAL OUT</div><div class="v" style="color:var(--red)">${fmt(out)}</div></div>
  </div>`+(list.length?list.map(p=>{const pt=parties.find(x=>x.id===p.partyId);return `
    <div class="list-it"><div class="row"><b>${esc(pt?pt.name:'Walk-in')}</b><b style="color:${p.dir==='in'?'var(--acc)':'var(--red)'}">${p.dir==='in'?'+':'−'}${fmt(p.amount)}</b></div>
    <div class="dim" style="margin-top:3px">${p.date}${p.note?' · '+esc(p.note):''}</div></div>`;}).join(''):'<div class="card dim">No payments yet</div>');
}
function viewExpenses(){
  const list=[...expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const tot=expenses.reduce((s,e)=>s+e.amount,0);
  v().innerHTML=`<div class="row" style="margin:8px 0"><b style="font-size:17px">💸 Expenses</b><span class="pill p-red">${fmt(tot)}</span></div>`+
    (list.length?list.map(e=>`<div class="list-it"><div class="row"><b>${esc(e.cat)}</b><b style="color:var(--red)">${fmt(e.amount)}</b></div>
    <div class="dim" style="margin-top:3px">${e.date}${e.note?' · '+esc(e.note):''}</div></div>`).join(''):'<div class="card dim">No expenses recorded</div>');
  const fab=document.createElement('button');fab.className='fab';fab.textContent='＋';fab.onclick=()=>newExpense();
  document.getElementById('app').appendChild(fab);setTimeout(()=>{const f=[...document.querySelectorAll('.fab')];f.slice(0,-1).forEach(x=>x.remove());},0);
}
function newExpense(){
  openSheet(sheetHead('💸 New Expense')+`
    <label>Category</label><select id="eCat"><option>Rent</option><option>Salaries</option><option>Transport</option><option>Utilities</option><option>Stock purchase</option><option>Other</option></select>
    <label>Amount</label><input type="number" id="eAmt">
    <label>Note</label><input id="eNote" placeholder="optional">
    <button class="btn b-acc" onclick="saveExpense()">💾 Save</button>`);
}
function saveExpense(){
  const amt=+document.getElementById('eAmt').value||0;if(amt<=0){toast('Enter amount');return;}
  expenses.push({id:uid(),date:today(),cat:document.getElementById('eCat').value,amount:amt,note:document.getElementById('eNote').value.trim()});
  saveAll();closeSheet();toast('💸 Saved');viewExpenses();
}
function viewReports(){
  const tot=invoices.filter(i=>i.type==='sale');
  const sales=tot.reduce((s,i)=>s+i.total,0);
  const cogs=tot.reduce((s,i)=>s+i.items.reduce((a,l)=>a+(l.cost||0)*l.qty,0),0);
  const exp=expenses.reduce((s,e)=>s+e.amount,0);
  const profit=sales-cogs-exp;
  const recv=receivables();
  v().innerHTML=`<b style="font-size:17px">📊 Reports</b>
  <div class="card"><b>📈 Profit & Loss (all time)</b>
    <div class="row" style="margin-top:10px"><span>Total sales</span><b>${fmt(sales)}</b></div>
    <div class="row" style="margin-top:6px"><span>Cost of goods</span><b>− ${fmt(cogs)}</b></div>
    <div class="row" style="margin-top:6px"><span>Expenses</span><b>− ${fmt(exp)}</b></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:10px 0">
    <div class="row"><b>NET PROFIT</b><b style="color:${profit>=0?'var(--acc)':'var(--red)'}">${fmt(profit)}</b></div>
  </div>
  <div class="card"><b>📕 Who owes you (deni book)</b>
    ${recv.length?recv.sort((a,b)=>b[1]-a[1]).map(([pid,b])=>{const p=parties.find(x=>x.id===pid);return `
      <div class="row" style="margin-top:8px"><span>${esc(p?p.name:'?')}</span><b style="color:var(--red)">${fmt(b)}</b></div>`;}).join(''):'<div class="dim" style="margin-top:8px">Nobody owes you 🎉</div>'}
  </div>
  <div class="card"><b>📦 Stock summary</b>
    <div class="row" style="margin-top:8px"><span>Total items</span><b>${items.length}</b></div>
    <div class="row" style="margin-top:6px"><span>Stock value (cost)</span><b>${fmt(stockValue())}</b></div>
    <div class="row" style="margin-top:6px"><span>Low stock alerts</span><b style="color:var(--red)">${items.filter(i=>(i.stock||0)<=(i.lowAt??3)).length}</b></div>
  </div>`;
}
function viewSettings(){
  v().innerHTML=`<b style="font-size:17px">⚙️ Settings</b>
  <label>Business name (on receipts)</label><input id="sBiz" value="${esc(settings.biz)}">
  <div class="grid2">
    <div><label>Currency</label><select id="sCur">${['UGX','KES','TZS','RWF','INR','USD','AED','NGN','GHS','ZAR'].map(c=>`<option ${c===settings.currency?'selected':''}>${c}</option>`).join('')}</select></div>
    <div><label>VAT/Tax % (0 = off)</label><input id="sTax" type="number" value="${settings.taxPct}"></div>
  </div>
  <button class="btn b-acc" onclick="saveSettings()">💾 Save Settings</button>`;
}
function saveSettings(){
  settings.biz=document.getElementById('sBiz').value.trim()||'My Business';
  settings.currency=document.getElementById('sCur').value;
  settings.taxPct=Math.max(0,+document.getElementById('sTax').value||0);
  saveAll();document.getElementById('bizName').textContent=settings.biz;
  toast('⚙️ Saved');viewHome();
}
function backupData(){
  const data=JSON.stringify({settings,items,parties,invoices,payments,expenses});
  if(window.AndroidShare){AndroidShare.shareFile?AndroidShare.shareFile(data):AndroidShare.share('DukaBooks backup:\n'+data);}
  else{const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dukabooks-backup.json';a.click();}
  toast('☁️ Backup shared');
}
function restoreData(){
  openSheet(sheetHead('♻️ Restore')+`<p class="dim">Paste your backup text below:</p>
  <textarea id="rData" rows="8" placeholder='{"settings":...}'></textarea>
  <button class="btn b-acc" onclick="doRestore()">♻️ Restore</button>`);
}
function doRestore(){
  try{const d=JSON.parse(document.getElementById('rData').value);
    if(!d.settings||!d.items)throw 0;
    settings=d.settings;items=d.items;parties=d.parties||[];invoices=d.invoices||[];payments=d.payments||[];expenses=d.expenses||[];
    saveAll();closeSheet();document.getElementById('bizName').textContent=settings.biz;
    toast('♻️ Restored!');go('home');
  }catch(e){toast('Invalid backup data');}
}

/* ================= INIT ================= */
const VIEWS={home:viewHome,sales:viewSales,stock:viewStock,parties:viewParties,more:viewMore};
document.getElementById('bizName').textContent=settings.biz;
go('home');
</script>
</body>
</html>
